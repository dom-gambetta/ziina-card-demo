<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Ziina Card Tilt</title>

<style>
/* Layout: one full-height stage, card centred, tiny hint line underneath. Single dark look on purpose (matches the app screen). */
:root{
  --stage-top:#5a22ad; --stage-mid:#33146c; --stage-low:#170a28; --ink:#04020a;
  --card-bg:#0f0529; --hint:#cbbcf5; --hint-dim:rgba(203,188,245,.55);
  --iri-blue:76,107,255; --iri-ice:143,211,255; --iri-peri:169,155,255; --iri-mint:150,240,214; --iri-peach:255,188,170;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage-low);color:var(--hint);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:fixed;inset:0;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;isolation:isolate}
/* Stage light: brightness follows the card's light (above 1 = brighter than the design, below = darker) */
.stage::before{content:"";position:absolute;inset:0;z-index:-1;filter:brightness(calc(1 - var(--sd)));
  background:
    radial-gradient(70% 28% at 50% 30%, rgba(118,28,179,.55), transparent 70%),
    radial-gradient(110% 24% at 50% 44%, rgba(59,15,148,.6), transparent 70%),
    linear-gradient(180deg,var(--stage-top) 0%,var(--stage-mid) 42%,var(--stage-low) 100%)}
/* Stage dimmer: a touch darker at rest, lifts gently with the card's light */
.wrap{--cw:min(84vw,440px);width:var(--cw);perspective:1100px;display:grid;gap:56px;justify-items:center;position:relative;z-index:1}
.tilt{position:relative;width:var(--cw);height:calc(var(--cw)*0.6143);transform-style:preserve-3d;
  transform:rotateZ(-4.92deg) rotateX(calc(var(--ty)*-9deg)) rotateY(calc(var(--tx)*11deg))}
.shadow{position:absolute;left:8%;right:8%;top:30%;bottom:-6%;border-radius:40%;background:var(--ink);opacity:.55;filter:blur(28px);
  transform:translate3d(calc(var(--tx)*-14px),calc(var(--ty)*-10px + 18px),-60px)}
.card{position:absolute;inset:0;border-radius:calc(var(--cw)*0.0307);overflow:hidden;background:var(--card-bg);filter:brightness(var(--dim));
  clip-path:inset(0 round calc(var(--cw)*0.0307));-webkit-clip-path:inset(0 round calc(var(--cw)*0.0307));-webkit-mask-image:-webkit-radial-gradient(white,black);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset;opacity:0;transition:opacity .25s}
.card.ready{opacity:1}
.strip{position:absolute;top:0;height:100%;width:calc(11.111% + 2px);overflow:hidden;left:calc(var(--i)*11.111% - 1px);transform:translateZ(0);backface-visibility:hidden}
.light{position:absolute;width:calc(var(--cw)*1.1277);height:calc(var(--cw)*0.6143*1.2079);
  left:calc(var(--cw)*var(--lx));top:calc(var(--cw)*0.6143*var(--ly));

.logo-gold{position:absolute;inset:0;pointer-events:none;

<div class="stage" id="stage" style="--tx:-0.6;--ty:0.35;--lit:-0.69;--boost:-0.08;--dim:0.82;--sd:0.26">
  <div class="wrap">
    <div class="tilt" id="tilt">
      <div class="shadow"></div>
      <div class="card" id="card">
        <div class="strip" style="--i:0;--k:1.216"><div class="light" style="--lx:-0.04852;--ly:-0.07483"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="strip" style="--i:1;--k:1.438"><div class="light" style="--lx:-0.14049;--ly:-0.09980"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="strip" style="--i:2;--k:1.019"><div class="light" style="--lx:-0.24905;--ly:-0.13097"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="strip" style="--i:3;--k:0.572"><div class="light" style="--lx:-0.37420;--ly:-0.11849"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="strip" style="--i:4;--k:0.752"><div class="light" style="--lx:-0.51085;--ly:-0.08110"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="strip" style="--i:5;--k:1.296"><div class="light" style="--lx:-0.64622;--ly:-0.08110"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="strip" style="--i:6;--k:1.406"><div class="light" style="--lx:-0.76883;--ly:-0.11849"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="strip" style="--i:7;--k:0.922"><div class="light" style="--lx:-0.87357;--ly:-0.13097"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="strip" style="--i:8;--k:0.552"><div class="light" style="--lx:-0.96297;--ly:-0.09773"></div><div class="ridge"></div><div class="edge"></div></div>
        <div class="sheen"></div>
        <img class="logos" alt="Ziina Visa travel card" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" id="logos">
        <div class="logo-gold" id="gold"></div>
        <div class="logo-shine" id="shine"></div>
        <div class="logo-gold edge-iri" id="egold"></div>
        <div class="logo-shine edge-iri" id="eshine"></div>
      </div>
    </div>
    <div class="hint">
      <span id="hintText">Tilt your phone, or drag the card</span>
      <button id="sway" type="button" aria-pressed="true" hidden>Auto sway</button>
      <button id="motion" type="button" hidden>Allow phone accelerometer</button>
    </div>
  </div>
</div>

<script>
(()=>{
  const stage=document.getElementById('stage'), tilt=document.getElementById('tilt');
  const swayBtn=document.getElementById('sway'), motionBtn=document.getElementById('motion'), hint=document.getElementById('hintText');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let sway=!reduce; swayBtn.setAttribute('aria-pressed',String(sway));
  let tx=0,ty=0, gx=0,gy=0, lastInput=-1e9, dragging=false, motionOn=false, t0=performance.now();
  const clamp=v=>Math.max(-1,Math.min(1,v));
  const setGoal=(x,y)=>{gx=clamp(x);gy=clamp(y);lastInput=performance.now();};

  // Screen edges are the limits: left/right edge = full tilt, centre = flat.
  function fromPoint(e){
    setGoal((e.clientX/innerWidth)*2-1,(e.clientY/innerHeight)*2-1);
  }
  stage.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'||dragging) fromPoint(e); });
  stage.addEventListener('pointerdown',e=>{dragging=true;stage.setPointerCapture(e.pointerId);fromPoint(e);});
  const end=()=>{dragging=false;gx=0;gy=0;lastInput=performance.now();};
  stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
  stage.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse'){gx=0;gy=0;} });

  swayBtn.addEventListener('click',()=>{sway=!sway;swayBtn.setAttribute('aria-pressed',String(sway));});

  // Phone motion: works when the browser allows it (it may be blocked inside an embedded page).
  function onOrient(e){ if(e.gamma==null) return; motionOn=true; setGoal(e.gamma/22,(e.beta-45)/22); }
  if('DeviceOrientationEvent' in window && typeof DeviceOrientationEvent.requestPermission!=='function') addEventListener('deviceorientation',onOrient);
  if('DeviceOrientationEvent' in window && matchMedia('(pointer: coarse)').matches){
    motionBtn.hidden=false;
    motionBtn.addEventListener('click',async()=>{
      try{
        if(typeof DeviceOrientationEvent.requestPermission==='function'){
          const s=await DeviceOrientationEvent.requestPermission(); if(s!=='granted') throw 0;
        }
        addEventListener('deviceorientation',onOrient);
        setTimeout(()=>{ if(!motionOn){ motionBtn.hidden=true; hint.textContent='Phone motion is blocked here. Drag the card instead'; } },1500);
        motionBtn.hidden=true;
      }catch(_){ motionBtn.hidden=true; hint.textContent='Phone motion is blocked here. Drag the card instead'; }
    });
  }

  // Intro: card starts turned away from the light (dark), swings toward it (very bright), then settles.
  const SD=0.14; // stage darkness at rest
  const KF=[ // [ms, tx, ty, boost, dim, stage darkness]
    [0,   -0.6,  0.35, -0.08, 0.82, 0.26],
    [500, -0.6,  0.35, -0.08, 0.82, 0.26],
    [2100, 0.6, -0.35,  0.1,  1,    -0.16],

      const r=p[j],g=p[j+1],b=p[j+2], mn=Math.min(r,g,b)/255, mxv=Math.max(r,g,b)/255;
      const w=Math.min(1,Math.max(0,(mn-0.42)/0.38));                  // whiteness: lettering
      const ea=Math.min(1,Math.max(0,(mxv-0.06)/0.45))*(1-w);          // coloured, non-white: the purple inset stroke
      if(ea>0){ t[j]=t[j+1]=t[j+2]=255; t[j+3]=Math.round(ea*255); }
      if(j<y0||!w) continue;
      q[j]=q[j+1]=q[j+2]=255; q[j+3]=Math.round(w*255);
      p[j]=r*(1-w); p[j+1]=g*(1-w); p[j+2]=b*(1-w);
    }
    cx.putImageData(d,0,0); mx.putImageData(m,0,0); ex.putImageData(e,0,0);
    return [cv.toDataURL('image/png'),mc.toDataURL('image/png'),ec.toDataURL('image/png')];
  }
  let started=false;
  const start=()=>{ if(started) return; started=true; document.getElementById('card').classList.add('ready'); requestAnimationFrame(frame); };
  setTimeout(start,1500); // never leave the card hidden
  gild(LOGO_SRC).then(([u,mk,em])=>{ for(const id of ['gold','shine']){ const el=document.getElementById(id); el.style.webkitMaskImage=el.style.maskImage='url('+mk+')'; }
    for(const id of ['egold','eshine']){ const el=document.getElementById(id); el.style.webkitMaskImage=el.style.maskImage='url('+em+')'; }
    const lg=document.getElementById('logos'); lg.src=u; (lg.decode?lg.decode():Promise.resolve()).then(start,start); })
    .catch(()=>{ document.getElementById('logos').src=LOGO_SRC; start(); });
})();
</script>
